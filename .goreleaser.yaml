# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
#
# Releases the project-standards binary (ADR 0002) with goreleaser v2, the free
# edition. The cicd workflow tags the release with svu first, then runs
# `goreleaser release --clean`, so goreleaser takes the version from that tag
# and computes none of its own. goreleaser only builds the archives: the
# workflow publishes them with `gh release create`, so every GitHub change in
# CI goes through the gh CLI.
version: 2

project_name: project-standards

builds:
  - id: project-standards
    main: ./cmd/project-standards
    binary: project-standards
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: file times come from the commit, not the clock.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: project-standards
    ids:
      - project-standards
    formats:
      - tar.gz
    # The binary sits at the archive root, next to the license and readme.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false

checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

changelog:
  disable: true

release:
  disable: true
